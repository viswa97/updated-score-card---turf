<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {

}
h1 {
  font-size: 2rem;
  margin-bottom: 6px;

}
.sub-title { color:#64748b; font-size:0.85rem; margin-bottom:16px; }
input, select, button {

  margin: 6px;
  font-size: 15px;
  border: none;
  border-radius: 8px;
  outline: none;
  font-family: inherit;
}
input, select {
  background: #1e293b;
  border: 1px solid #334155;
  color: white;
  width: 240px;
  max-width: 100%;
  transition: border-color 0.25s;
}
input:focus, select:focus { border-color: #22c55e; }
button { cursor: pointer; font-weight: bold; transition: transform 0.1s, filter 0.2s; min-width: 56px; }
button:hover { filter: brightness(1.1); }
button:active { transform: scale(0.95); }

.btn-run { background: linear-gradient(135deg,#22c55e,#16a34a); color:#fff; font-size:19px; width:64px; height:52px; box-shadow:0 4px 12px rgba(34,197,94,.25); }
.btn-dot { background: linear-gradient(135deg,#64748b,#475569); color:#fff; min-width:110px; height:46px; }
.btn-wicket { background: linear-gradient(135deg,#ef4444,#dc2626); color:#fff; min-width:110px; height:46px; box-shadow:0 4px 12px rgba(239,68,68,.25); }
.btn-runout { background: linear-gradient(135deg,#a855f7,#7e22ce); color:#fff; min-width:110px; height:46px; box-shadow:0 4px 12px rgba(168,85,247,.25); }
.btn-extra { background: linear-gradient(135deg,#f59e0b,#d97706); color:#1e293b; min-width:110px; height:46px; }
.btn-extra2 { background:#1e293b; border:1px solid #f59e0b; color:#fbbf24; min-width:110px; height:46px; }
.btn-undo { background: linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; min-width:110px; height:46px; }
.btn-start { background: linear-gradient(135deg,#22c55e,#16a34a); color:#fff; font-size:16px; padding:14px 34px; box-shadow:0 4px 16px rgba(34,197,94,.35); }
.btn-ghost { background:#1e293b; border:1px solid #334155; color:#94a3b8; padding:14px 24px; }

.card {
  background: rgba(2,6,23,.72);
  backdrop-filter: blur(10px);
  padding: 18px;
  margin: 15px auto;
  border-radius: 16px;
  border: 1px solid #1e293b;
  max-width: 560px;
  box-shadow: 0 8px 32px rgba(0,0,0,.3);
}
.score-display {
  font-size: 3rem;
  font-weight: bold;
  background: linear-gradient(90deg,#fff,#94a3b8);

  margin: 6px 0;
  line-height:1.1;
}
.status-text { font-size:1.05rem; color:#38bdf8; margin-bottom:4px; }
.target-text { color:#facc15; font-size:.95rem; margin:4px 0; }
.req-text { color:#f87171; font-size:.9rem; }
.crr-text { color:#64748b; font-size:.8rem; margin-top:2px; }
.extras-text { color:#fbbf24; font-size:.82rem; margin-top:6px; }

.btn-group { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:8px 0; }

.live-panel { background:#111c33; border:1px solid #1e293b; border-radius:12px; padding:10px; margin-top:12px; text-align:left; font-size:.85rem; }
.live-row { display:flex; justify-content:space-between; padding:3px 0; color:#cbd5e1; }
.live-row b { color:#fff; }
.live-head { color:#38bdf8; font-size:.75rem; text-transform:uppercase; letter-spacing:.5px; margin:6px 0 2px; }
.on-strike { color:#22c55e; }

.over-card { background:#1e293b; border-radius:12px; padding:12px; margin:10px 0; text-align:left; border:1px solid #334155; }

.over-total { color:#22c55e; font-weight:bold; white-space:nowrap; }

.ball {

}
.b-dot { background:#374151; color:#9ca3af; }
.b-1, .b-2, .b-3 { background:#1d4ed8; color:#fff; }
.b-4 { background:#16a34a; color:#fff; }
.b-6 { background:#dc2626; color:#fff; }
.b-w { background:#991b1b; color:#fca5a5; }
.b-wide { background:#d97706; color:#fff; }
.b-nb { background:#ca8a04; color:#1e293b; }
.b-ro { background:#7e22ce; color:#fff; }
.b-empty { background:#1e293b; border:1px dashed #475569; color:#475569; }
.over-summary { margin-top:8px; font-size:.78rem; color:#94a3b8; }

.sc-table { width:100%; border-collapse:collapse; font-size:.8rem; margin-bottom:6px; }
.sc-table th { color:#38bdf8; text-align:left; padding:6px 4px; border-bottom:1px solid #334155; font-size:.72rem; text-transform:uppercase; }
.sc-table td { padding:6px 4px; border-bottom:1px solid #16233c; color:#cbd5e1; }
.sc-table td.n, .sc-table th.n { text-align:right; }
.sc-name { color:#fff; }
.sc-out { color:#64748b; font-size:.72rem; }
.sec-head { color:#38bdf8; font-size:.9rem; text-align:left; margin:14px 0 6px; font-weight:bold; }

.squad-wrap { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.squad-box { flex:1; min-width:200px; background:#111c33; border:1px solid #1e293b; border-radius:12px; padding:12px; }
.squad-box h4 { color:#22c55e; margin-bottom:8px; font-size:.9rem; }
.pl-input { width:100%; margin:4px 0; padding:9px 12px; font-size:14px; }

.hidden { display:none !important; }
.innings-badge { display:inline-block; background:#22c55e; color:#0f172a; padding:4px 12px; border-radius:20px; font-size:.75rem; font-weight:bold; margin-bottom:8px; }
.result-text { font-size:1.4rem; font-weight:bold; margin:10px 0; color:#22c55e; animation:pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.65} }

.modal-overlay { position:fixed; inset:0; background:rgba(2,6,23,.85); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; }
.modal { background:#0f1e38; border:1px solid #334155; border-radius:16px; padding:22px; max-width:440px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.6); max-height:90vh; overflow-y:auto; }
.modal h3 { color:#38bdf8; margin-bottom:12px; font-size:1.15rem; }
.m-label { color:#94a3b8; font-size:.8rem; margin:14px 0 4px; text-align:left; text-transform:uppercase; letter-spacing:.5px; }
.m-actions { margin-top:18px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.opt-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.opt-btn { background:#1e293b; border:2px solid #334155; color:#cbd5e1; padding:10px 14px; min-width:78px; font-size:14px; line-height:1.3; }
.opt-btn small { display:block; font-weight:normal; font-size:.7rem; color:#64748b; margin-top:2px; }
.opt-btn.active { border-color:#22c55e; background:#14331f; color:#fff; }
.opt-btn.active small { color:#86efac; }
.modal select { width:100%; }
</style>
</head>
